
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Ordering System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark p-3">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Food Ordering System</a>
        <a href="#cart" class="btn btn-warning">My Cart 🛒</a>
    </div>
</nav>

<header class="hero text-center text-white p-5">
    <h1>Delicious Food, Delivered Fast!</h1>
    <p>Order your favourite food online.</p>
</header>

<div class="container my-5">

    <h2 class="text-center mb-4">Our Food Menu</h2>
    <div class="row" id="food-list"></div>

    <hr class="my-5">

    <section id="cart">
        <h2>Shopping Cart</h2>
        <div id="cart-items" class="my-3"></div>
        <h4>Total Bill: Rs. <span id="total">0</span></h4>
    </section>

    <hr class="my-5">

    <h2>Customer Details</h2>

    <form id="order-form" class="mt-3">

        <div class="mb-3">
            <label class="form-label">Customer Name</label>
            <input type="text" id="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" id="phone" class="form-control"
                   pattern="[0-9+ -]{7,15}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Delivery Address</label>
            <textarea id="address" class="form-control" required></textarea>
        </div>

        <button type="submit" class="btn btn-success">
            Place Order
        </button>

    </form>

    <div id="message" class="mt-3"></div>

</div>

<footer class="bg-dark text-white text-center p-3">
    Online Food Ordering System
</footer>

<script src="script.js"></script>

</body>
</html>
